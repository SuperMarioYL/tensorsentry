<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" data-palette="e1e656-a0e76a-f6ddac-23fdd73d23b1" role="img" aria-labelledby="process-dark-title process-dark-desc"><title id="process-dark-title">tensorsentry process</title><desc id="process-dark-desc">The real tiny tensor passes its demo profile; an empty tensor set produces a missing-tensor anomaly.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="1000" y2="465"><stop stop-color="#e1e656"/><stop offset=".6" stop-color="#a0e76a"/><stop offset="1" stop-color="#f6ddac"/></linearGradient><radialGradient id="halo"><stop stop-color="#e1e656" stop-opacity=".22"/><stop offset="1" stop-color="#0a0c0d" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#393c1d" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#e1e656" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="1000" height="465" rx="16" fill="#0a0c0d"/><rect width="1000" height="465" rx="16" fill="url(#grid)"/><ellipse cx="630.0" cy="199.95" rx="500.0" ry="325.5" fill="url(#halo)"/><text x="44" y="44" fill="#b1b9a8" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM INPUT TO RESULT</text><text x="44" y="84.0" fill="#fdf8ee" font-size="30" text-anchor="start" font-weight="400">From input to a useful result</text><path d="M332.0 237H356.0" fill="none" stroke="#e1e656" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M332.0 237H356.0" class="flow" fill="none" stroke="#f6ddac" stroke-width="2"/><rect x="44.0" y="176" width="288.0" height="122" rx="12" fill="#131717" stroke="#393c1d"/><text x="62.0" y="207.0" fill="#fdf8ee" font-size="21" text-anchor="start" font-weight="400">01  Write tiny tensor</text><text x="62.0" y="259.0" fill="#b1b9a8" font-size="17" text-anchor="start" font-weight="400">Two F32 values</text><path d="M644.0 237H668.0" fill="none" stroke="#e1e656" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M644.0 237H668.0" class="flow" fill="none" stroke="#f6ddac" stroke-width="2"/><rect x="356.0" y="176" width="288.0" height="122" rx="12" fill="#131717" stroke="#393c1d"/><text x="374.0" y="207.0" fill="#fdf8ee" font-size="21" text-anchor="start" font-weight="400">02  Read metadata</text><text x="374.0" y="259.0" fill="#b1b9a8" font-size="17" text-anchor="start" font-weight="400">Name, dtype and shape</text><rect x="668.0" y="176" width="288.0" height="122" rx="12" fill="#131717" stroke="#393c1d"/><text x="686.0" y="207.0" fill="#fdf8ee" font-size="21" text-anchor="start" font-weight="400">03  Compare profile</text><text x="686.0" y="259.0" fill="#b1b9a8" font-size="17" text-anchor="start" font-weight="400">Valid versus missing</text><text x="686.0" y="282.8" fill="#b1b9a8" font-size="17" text-anchor="start" font-weight="400">tensor</text><text x="44" y="379.0" fill="#f6ddac" font-size="20" text-anchor="start" font-weight="400">The real tiny tensor passes its demo profile; an empty tensor set produces a</text><text x="44" y="407.0" fill="#f6ddac" font-size="20" text-anchor="start" font-weight="400">missing-tensor anomaly.</text></svg>
