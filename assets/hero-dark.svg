<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="TensorSentry — agent-safety scanner for CN-model weights">
  <defs>
    <linearGradient id="hg-d" x1="-220%" y1="0%" x2="-100%" y2="0%">
      <stop offset="0%" stop-color="#8985FF"/>
      <stop offset="50%" stop-color="#2DC79A"/>
      <stop offset="100%" stop-color="#8985FF"/>
      <animate attributeName="x1" values="-220%;100%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-100%;220%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="hs-d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8985FF" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#8985FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2DC79A" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="#1D1D1F"/>
  <rect x="0" y="96" width="880" height="108" fill="url(#hs-d)"/>
  <text x="440" y="152" text-anchor="middle" font-size="60" font-weight="700" fill="url(#hg-d)" letter-spacing="-1">TensorSentry</text>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.4s" dur="0.8s" fill="freeze"/>
    <text x="440" y="196" text-anchor="middle" font-size="17" font-weight="500" fill="#A1A1A8">权哨 · agent-safety scanner for CN-model weights (MoE / MLA + pickle exploit)</text>
  </g>
  <circle cx="424" cy="232" r="3" fill="#8985FF">
    <animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.5;1" dur="2.4s"
             calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
  </circle>
  <circle cx="440" cy="232" r="3" fill="#2DC79A">
    <animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.5;1" dur="2.4s" begin="-0.8s"
             calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
  </circle>
  <circle cx="456" cy="232" r="3" fill="#8985FF">
    <animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.5;1" dur="2.4s" begin="-1.6s"
             calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
  </circle>
</svg>
