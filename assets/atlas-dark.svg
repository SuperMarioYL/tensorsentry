<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：weight artifact → TensorSentry scan (header parse / profile match / pickle scan) → verdict">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>
  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="210" y1="180" x2="350" y2="180" marker-end="url(#ah-d)"/>
    <line x1="525" y1="180" x2="665" y2="180" marker-end="url(#ah-d)"/>
  </g>
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="180" x2="346" y2="180" stroke="#8985FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="525" y1="180" x2="661" y2="180" stroke="#2DC79A" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
  </g>
  <g>
    <circle r="3.5" fill="#8985FF">
      <animateMotion path="M210,180 L346,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#2DC79A">
      <animateMotion path="M525,180 L661,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <rect x="40" y="132" width="170" height="96" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#7FB8FF">Weight artifact</text>
    <text x="125" y="190" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">.safetensors / .gguf</text>
    <text x="125" y="208" text-anchor="middle" font-size="10" fill="#A1A1A8">DeepSeek-V4 · Kimi K3 · Qwen3.7</text>

    <rect x="355" y="116" width="170" height="128" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#B3B0FF">TensorSentry scan</text>
    <text x="440" y="174" text-anchor="middle" font-size="10.5" fill="#A1A1A8">header-only parse</text>
    <text x="440" y="190" text-anchor="middle" font-size="10.5" fill="#A1A1A8">profile match (MoE/MLA)</text>
    <text x="440" y="206" text-anchor="middle" font-size="10.5" fill="#A1A1A8">pickle exploit detect</text>
    <text x="440" y="226" text-anchor="middle" font-size="10.5" fill="#A1A1A8">provenance (m3 stub)</text>

    <rect x="665" y="132" width="170" height="96" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="750" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#5BD9AE">Verdict</text>
    <text x="750" y="190" text-anchor="middle" font-size="10.5" fill="#A1A1A8">STRUCTURE · EXPLOIT</text>
    <text x="750" y="206" text-anchor="middle" font-size="10.5" fill="#A1A1A8">PROVENANCE</text>
    <text x="750" y="222" text-anchor="middle" font-size="10" fill="#A1A1A8">--json for CI</text>
  </g>
  <text x="440" y="296" text-anchor="middle" font-size="11" fill="#A1A1A8">
    one process · header-only (70 GB checkpoint scans in seconds) · no weight bytes loaded
  </text>
</svg>
