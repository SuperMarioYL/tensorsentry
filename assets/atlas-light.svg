<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：weight artifact → TensorSentry scan (header parse / profile match / pickle scan) → verdict">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>
  <!-- 底层静线 -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="210" y1="180" x2="350" y2="180" marker-end="url(#ah-l)"/>
    <line x1="525" y1="180" x2="665" y2="180" marker-end="url(#ah-l)"/>
  </g>
  <!-- 顶层行军虚线(数据流) — dasharray 周期=16，from 32→0 = 2 周期 → 无缝循环 -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="180" x2="346" y2="180" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="525" y1="180" x2="661" y2="180" stroke="#10A37F" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- 数据包圆点沿连线流动 (animateMotion) -->
  <g>
    <circle r="3.5" fill="#5E5CE6">
      <animateMotion path="M210,180 L346,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#10A37F">
      <animateMotion path="M525,180 L661,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- nodes — 呼吸 = fill-opacity 0.10↔0.18 spline 缓动，三节点负 begin 错峰 -->
  <g>
    <!-- INPUT: weight artifact (blue infra) -->
    <rect x="40" y="132" width="170" height="96" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">Weight artifact</text>
    <text x="125" y="190" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">.safetensors / .gguf</text>
    <text x="125" y="208" text-anchor="middle" font-size="10" fill="#6E6E73">DeepSeek-V4 · Kimi K3 · Qwen3.7</text>

    <!-- CORE: TensorSentry scan (purple agent) -->
    <rect x="355" y="116" width="170" height="128" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">TensorSentry scan</text>
    <text x="440" y="174" text-anchor="middle" font-size="10.5" fill="#6E6E73">header-only parse</text>
    <text x="440" y="190" text-anchor="middle" font-size="10.5" fill="#6E6E73">profile match (MoE/MLA)</text>
    <text x="440" y="206" text-anchor="middle" font-size="10.5" fill="#6E6E73">pickle exploit detect</text>
    <text x="440" y="226" text-anchor="middle" font-size="10.5" fill="#6E6E73">provenance (m3 stub)</text>

    <!-- OUTPUT: verdict (green inference/safe) -->
    <rect x="665" y="132" width="170" height="96" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="750" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B53">Verdict</text>
    <text x="750" y="190" text-anchor="middle" font-size="10.5" fill="#6E6E73">STRUCTURE · EXPLOIT</text>
    <text x="750" y="206" text-anchor="middle" font-size="10.5" fill="#6E6E73">PROVENANCE</text>
    <text x="750" y="222" text-anchor="middle" font-size="10" fill="#6E6E73">--json for CI</text>
  </g>
  <!-- legend row -->
  <text x="440" y="296" text-anchor="middle" font-size="11" fill="#6E6E73">
    one process · header-only (70 GB checkpoint scans in seconds) · no weight bytes loaded
  </text>
</svg>
