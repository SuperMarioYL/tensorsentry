<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="TensorSentry — agent-safety scanner for CN-model weights">
  <defs>
    <!-- 流光：渐变窗口整体左→右平移。s=0 窗口 [-220%,-100%]、s=1 窗口 [100%,220%]，
         两端标题都渲染 pad 纯色 → 接缝帧逐像素相同 → 无缝循环。 -->
    <linearGradient id="hg-l" x1="-220%" y1="0%" x2="-100%" y2="0%">
      <stop offset="0%" stop-color="#5E5CE6"/>
      <stop offset="50%" stop-color="#10A37F"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
      <animate attributeName="x1" values="-220%;100%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-100%;220%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="hs-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5E5CE6" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#5E5CE6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10A37F" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="#F5F5F7"/>
  <rect x="0" y="96" width="880" height="108" fill="url(#hs-l)"/>
  <text x="440" y="152" text-anchor="middle" font-size="60" font-weight="700" fill="url(#hg-l)" letter-spacing="-1">TensorSentry</text>
  <!-- tagline 入场：一次性淡入+上移(freeze)，仅装饰不载关键信息 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.4s" dur="0.8s" fill="freeze"/>
    <text x="440" y="196" text-anchor="middle" font-size="17" font-weight="500" fill="#6E6E73">权哨 · agent-safety scanner for CN-model weights (MoE / MLA + pickle exploit)</text>
  </g>
  <!-- 域色脉冲点（装饰，无限循环） -->
  <circle cx="424" cy="232" r="3" fill="#5E5CE6">
    <animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.5;1" dur="2.4s"
             calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
  </circle>
  <circle cx="440" cy="232" r="3" fill="#10A37F">
    <animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.5;1" dur="2.4s" begin="-0.8s"
             calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
  </circle>
  <circle cx="456" cy="232" r="3" fill="#5E5CE6">
    <animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.5;1" dur="2.4s" begin="-1.6s"
             calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
  </circle>
</svg>
