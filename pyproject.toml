[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorsentry"
version = "0.1.0"
description = "Agent-safety scanner that validates CN-model weights (MoE/MLA tensor structure + pickle exploit detection) before agents load them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "SuperMarioYL" }]
keywords = [
  "agent-safety",
  "supply-chain",
  "safetensors",
  "gguf",
  "deepseek",
  "kimi",
  "qwen",
  "model-weights",
  "moe",
  "mla",
  "pickle",
  "security",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "requests>=2.32",
  "safetensors>=0.4.5",
  "gguf>=0.10",
  "picklescan>=0.0.21",
]

[project.optional-dependencies]
provenance = ["sigstore>=3.0"]
dev = ["pytest>=8", "pytest-cov"]
build = ["build>=1.2"]

[project.scripts]
tensorsentry = "tensorsentry.cli:main"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/tensorsentry"
Source = "https://github.com/SuperMarioYL/tensorsentry"
Issues = "https://github.com/SuperMarioYL/tensorsentry/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
source = ["tensorsentry"]
